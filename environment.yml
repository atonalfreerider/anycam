name: anycam
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - cuda-toolkit
  - pip
  - pip:
      - torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
      - torchvision --index-url https://download.pytorch.org/whl/cu124
      - torchaudio --index-url https://download.pytorch.org/whl/cu124
      - xformers --index-url https://download.pytorch.org/whl/cu124
      - tqdm
      - opencv-python
      - transformers
      - ipython
      - matplotlib
      - rerun-sdk
      - pytorch-ignite
      - moviepy
      - dotdict
      - einops
      - scipy
      - wandb
      - tensorboard
      - triton<=3.1
      - hydra-core
      - pycolmap
      - evo
      - tabulate
      - scikit-image
      - pyceres
      - kornia
      - timm
      - projectaria-tools
